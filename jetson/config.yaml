# SAYZEK - HIL ve Saha Testi Parametreleri

yolo:
  model_path: "Yolo26-640.engine"
  conf_threshold: 0.4
  imgsz: 640

kamera:
  width: 640
  height: 640
  focal_length_px: 1253.0  # Kamera kalibrasyonuna göre ayarlanmalı

drone:
  target_width_m: 0.55 # Hedef düşman İHA'nın kanat açıklığı (metre)

limitler:
  max_vx: 5.0    # 9.0 → 5.0  (kaçarken çok uzaklaşıyor, model kayboluyor)
  max_vy: 4.0    # 6.0 → 4.0
  max_vz: 3.0
  max_yaw_rate: 1.5


tehdit_esikleri:
  threat_px: 115         # 35 → 115  (6m, eskiye dön — 35px çok erken)
  target_diameter_px: 86 # 26 → 86   (8m ideal)
  enemy_too_close_px: 130 # 230 → 172 (4m — daha gerçekçi panik mesafesi)
  enemy_too_far_px: 45   # aynı kalır
  growth_rate_threat: 0.8
  growth_rate_panic: 2.0
  center_tolerance_px: 70

kazanclar:
  evade_gain: 5.0
  growth_gain: 1.2
  lateral_gain: 5.0
  vertical_gain: 2.0
  yaw_gain: 2.0
  yaw_panic_damp: 0.4

filtreler:
  ema_alpha: 0.6
  growth_history: 8
  kf_process_noise: 1.0
  kf_meas_noise: 25.0

state_machine:
  min_frames_to_change: 2
  lost_timeout_frames: 8

sistem:
  mavlink_hz: 20
  log_enabled: true
  
orbit:
  frame_count: 30              # 12 → 30
  safe_min_px: 50              # 75 → 60  (72px ortalamasını kapsasın)
  safe_max_px: 115
  safe_ideal_px: 86
  frame_interval_s: 1.5
  stable_frames_required: 8   # 20 → 10
  save_dir: "orbit_frames"
  rtl_delay_s: 2.0
  sweep_vy: 0.8  
